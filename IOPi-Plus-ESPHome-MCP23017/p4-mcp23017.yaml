substitutions:
  name: "p4-mcp23017"
  friendly_name: "P4 MCP23017 IO"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  framework:
    type: esp-idf
web_server:
  port: 80
  version: 3
  log: true
# ESP32-C6 coprocessor provides Wi-Fi on the P4 (pins for P4 EV board / Waveshare P4-Nano)
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

logger:
  level: DEBUG
  hardware_uart: UART0

# Keep the api encryption key / ota password the Device Builder generated for you
api:

ota:
  - platform: esphome

wifi:
  ssid: yourssid
  password: yourpassword

# I2C bus - change sda/scl to whichever header pins you've wired the board to
i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz
  scan: true

mcp23017:
  - id: mcp_in        # chip 1 - inputs
    address: 0x20
  - id: mcp_out       # chip 2 - outputs
    address: 0x21

# ---------------------------------------------------------------
# INPUTS - MCP23017 @ 0x20
# Pins 0-7 = GPA0-GPA7, pins 8-15 = GPB0-GPB7
# Internal pull-ups enabled; inverted so grounding a pin = ON
# ---------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: "Input 1"
    pin: { mcp23xxx: mcp_in, number: 0, mode: { input: true, pullup: true }, inverted: true }
    filters: [ delayed_on_off: 20ms ]
    on_state:
      - logger.log: { format: "Input 1 (0x20 GPA0) = %s", args: [ 'x ? "ON" : "OFF"' ], level: INFO }

  - platform: gpio
    name: "Input 2"
    pin: { mcp23xxx: mcp_in, number: 1, mode: { input: true, pullup: true }, inverted: true }
    filters: [ delayed_on_off: 20ms ]
